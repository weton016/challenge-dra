<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<style>
  text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1c1917; }
  .muted { fill: #57534e; }
  .title { font-size: 18px; font-weight: 650; }
  .sub { font-size: 12px; fill: #57534e; }
  .axis { font-size: 12px; fill: #57534e; }
  .label { font-size: 13px; font-weight: 600; }
  .small { font-size: 12px; }
</style>
<rect width="720" height="340" fill="#f7f5f0"/>
<text class="title" x="24" y="32">Processos no Compose</text>
<text class="sub" x="24" y="54">Um PostgreSQL é a autoridade. As duas APIs não decidem saldo fora dele.</text>
<rect x="40" y="120" width="130" height="64" rx="8" fill="#fffdf8" stroke="#1e3a5f" stroke-width="1.5"/>
<text class="label" x="105" y="148" text-anchor="middle">k6 / curl</text>
<text class="small muted" x="105" y="168" text-anchor="middle">cliente</text>
<rect x="250" y="88" width="150" height="56" rx="8" fill="#1e3a5f"/>
<text class="label" x="325" y="122" text-anchor="middle" fill="#fffdf8">API :8080</text>
<rect x="250" y="164" width="150" height="56" rx="8" fill="#1e3a5f"/>
<text class="label" x="325" y="198" text-anchor="middle" fill="#fffdf8">API :8081</text>
<rect x="500" y="100" width="180" height="108" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text class="label" x="590" y="140" text-anchor="middle">PostgreSQL 16</text>
<text class="small" x="590" y="162" text-anchor="middle">pix</text>
<text class="small" x="590" y="180" text-anchor="middle">pix_external</text>
<rect x="250" y="250" width="150" height="52" rx="8" fill="#ffedd5" stroke="#9a3412"/>
<text class="label" x="325" y="282" text-anchor="middle">Simulador</text>
<path d="M170 146 H250 M170 168 H230 V192 H250" fill="none" stroke="#1c1917" stroke-width="1.5"/>
<path d="M400 116 H500 M400 192 H500" fill="none" stroke="#1c1917" stroke-width="1.5"/>
<path d="M325 220 V250" fill="none" stroke="#9a3412" stroke-width="1.5"/>
<path d="M400 276 H520 V208" fill="none" stroke="#9a3412" stroke-width="1.5"/>
<text class="axis" x="188" y="132">POST</text>
<text class="axis" x="430" y="108">COMMIT</text>
<text class="axis" x="412" y="246" fill="#9a3412">outbox</text>
</svg>
