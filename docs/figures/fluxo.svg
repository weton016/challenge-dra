<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
<style>
  text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1c1917; }
  .muted { fill: #57534e; }
  .title { font-size: 18px; font-weight: 650; }
  .sub { font-size: 12px; fill: #57534e; }
  .axis { font-size: 12px; fill: #57534e; }
  .label { font-size: 13px; font-weight: 600; }
  .small { font-size: 12px; }
</style>
<rect width="760" height="360" fill="#f7f5f0"/>
<text class="title" x="24" y="32">Do cliente ao banco</text>
<text class="sub" x="24" y="54">A resposta 200 só sai depois do COMMIT. 503 não grava DECLINED.</text>
<rect x="24" y="88" width="120" height="72" rx="8" fill="#fffdf8" stroke="#1e3a5f"/><text class="axis" x="36" y="110">1</text><text class="label" x="84" y="132" text-anchor="middle">Cliente</text><text class="small muted" x="84" y="150" text-anchor="middle">POST /transfers</text><path d="M144 124 H172" stroke="#1c1917" stroke-width="1.5"/><rect x="168" y="88" width="120" height="72" rx="8" fill="#fffdf8" stroke="#1e3a5f"/><text class="axis" x="180" y="110">2</text><text class="label" x="228" y="132" text-anchor="middle">HTTP</text><text class="small muted" x="228" y="150" text-anchor="middle">Bearer e 1,5 s</text><path d="M288 124 H316" stroke="#1c1917" stroke-width="1.5"/><rect x="312" y="88" width="120" height="72" rx="8" fill="#fffdf8" stroke="#1e3a5f"/><text class="axis" x="324" y="110">3</text><text class="label" x="372" y="132" text-anchor="middle">Lote</text><text class="small muted" x="372" y="150" text-anchor="middle">até 64 · 15 ms</text><path d="M432 124 H460" stroke="#1c1917" stroke-width="1.5"/><rect x="456" y="88" width="120" height="72" rx="8" fill="#fffdf8" stroke="#1e3a5f"/><text class="axis" x="468" y="110">4</text><text class="label" x="516" y="132" text-anchor="middle">Lock</text><text class="small muted" x="516" y="150" text-anchor="middle">advisory + contas</text><path d="M576 124 H604" stroke="#1c1917" stroke-width="1.5"/><rect x="600" y="88" width="120" height="72" rx="8" fill="#fffdf8" stroke="#1e3a5f"/><text class="axis" x="612" y="110">5</text><text class="label" x="660" y="132" text-anchor="middle">Decide</text><text class="small muted" x="660" y="150" text-anchor="middle">saldo e valor</text>
<rect x="80" y="200" width="280" height="88" rx="8" fill="#dcfce7" stroke="#166534"/>
<text class="label" x="220" y="232" text-anchor="middle">APPROVED</text>
<text class="small" x="220" y="254" text-anchor="middle">operations + 2 entries</text>
<text class="small" x="220" y="272" text-anchor="middle">débito e crédito no mesmo COMMIT</text>
<rect x="400" y="200" width="280" height="88" rx="8" fill="#ffe4e6" stroke="#9f1239"/>
<text class="label" x="540" y="232" text-anchor="middle">DECLINED</text>
<text class="small" x="540" y="254" text-anchor="middle">operations, zero entries</text>
<text class="small" x="540" y="272" text-anchor="middle">saldo da origem intacto</text>
<path d="M660 160 V186 H220 V200 M660 186 H540 V200" fill="none" stroke="#1c1917" stroke-width="1.5"/>
<text class="sub" x="24" y="324">Mesma transaction_id e o mesmo payload devolvem a decisão já gravada. Payload diferente: HTTP 409.</text>
<text class="sub" x="24" y="344">Fonte do caminho: internal/presentation/httpapi e internal/infrastructure/postgres/batch.go.</text>
</svg>
