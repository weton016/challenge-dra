name: drac-pix
x-tigerbeetle: &tigerbeetle
  image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
  # io_uring is blocked by Docker's default seccomp profile.
  security_opt: ["seccomp=unconfined"]
  entrypoint: ["tini", "--", "sh", "-c"]
  healthcheck:
    test: ["CMD", "nc", "-z", "127.0.0.1", "3000"]
    interval: 2s
    timeout: 2s
    retries: 60
services:
  tigerbeetle:
    <<: *tigerbeetle
    command:
      - >-
        test -f /data/0_0.tigerbeetle ||
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle;
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --cache-grid=512MiB /data/0_0.tigerbeetle
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - tbdata:/data
  # Disposable cluster for tests: --development keeps it near 1.4 GiB.
  tigerbeetle-test:
    <<: *tigerbeetle
    profiles: ["test"]
    command:
      - >-
        /tigerbeetle format --development --cluster=0 --replica=0 --replica-count=1 /tmp/0_0.tigerbeetle &&
        exec /tigerbeetle start --development --addresses=0.0.0.0:3000 /tmp/0_0.tigerbeetle
    ports: ["127.0.0.1:3001:3000"]
  api:
    build: .
    environment: &api-env
      TB_ADDRESS: tigerbeetle:3000
      API_KEY: local-development-key
      EXTERNAL_URL: http://simulator:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      tigerbeetle: {condition: service_healthy}
  api2:
    build: .
    environment: *api-env
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      tigerbeetle: {condition: service_healthy}
  simulator:
    build: .
    environment:
      TB_ADDRESS: tigerbeetle:3000
      API_KEY: local-development-key
      APP_MODE: simulator
    depends_on:
      tigerbeetle: {condition: service_healthy}
volumes:
  tbdata:
