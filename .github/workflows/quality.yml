name: quality
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      # A services container cannot take the custom entrypoint and seccomp option.
      - run: make test-ledger
      - run: make qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: reports/
